<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guntur Restro | Authentic Flavours & Biryani (Instant Preview)</title>
  <meta name="description" content="Discover delicious biryani and authentic flavours at Guntur Restro near Srungavarapukota, Andhra Pradesh." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Embedded Design System matching index.css */
    :root {
      --bg-dark: #090b0e;
      --bg-surface-1: #12161f;
      --bg-surface-2: #19202c;
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-gold: rgba(212, 175, 55, 0.3);
      --accent-red: #d32f2f;
      --accent-gold: #d4af37;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --font-heading: 'Cinzel', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-display: 'Outfit', sans-serif;
      --radius-md: 14px;
      --radius-full: 9999px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); background: var(--bg-dark); color: var(--text-primary); line-height: 1.6; }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    .section-padding { padding: 5rem 0; }
    .glass-card { background: var(--bg-surface-1); border: 1px solid var(--glass-border); border-radius: var(--radius-md); backdrop-filter: blur(12px); }
    
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.85rem 1.75rem; border-radius: var(--radius-full); font-family: var(--font-display); font-weight: 600; cursor: pointer; text-decoration: none; border: none; transition: all 0.3s ease; }
    .btn-primary { background: linear-gradient(135deg, var(--accent-red) 0%, #b71c1c 100%); color: #fff; box-shadow: 0 4px 15px rgba(211,47,47,0.4); }
    .btn-gold { background: linear-gradient(135deg, var(--accent-gold) 0%, #b89028 100%); color: #090b0e; font-weight: 700; box-shadow: 0 4px 15px rgba(212,175,55,0.3); }
    .btn-outline { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--glass-border); }

    /* Header Navbar */
    .header-nav { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background: rgba(9,11,14,0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--glass-border-gold); padding: 1rem 0; }
    .header-flex { display: flex; align-items: center; justify-content: space-between; }
    .brand-title { font-family: var(--font-heading); font-size: 1.4rem; font-weight: 800; color: #fff; text-decoration: none; }
    .brand-highlight { color: var(--accent-gold); }
    .nav-links { display: flex; gap: 1.75rem; list-style: none; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-family: var(--font-display); font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: var(--accent-gold); }

    /* Hero */
    .hero-hero { position: relative; padding-top: 10rem; padding-bottom: 6rem; text-align: center; overflow: hidden; }
    .hero-hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.35); z-index: 1; }
    .hero-hero-content { position: relative; z-index: 2; max-width: 800px; margin: 0 auto; }
    .hero-hero h1 { font-family: var(--font-heading); font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; line-height: 1.15; margin-bottom: 1.25rem; }
    .text-gold { color: var(--accent-gold); }
    .hero-hero p { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 2rem; }
    .hero-btns { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }

    /* Menu Grid */
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.75rem; margin-top: 2rem; }
    .menu-item-card { padding: 1.5rem; }
    .menu-item-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 1rem; }
    .menu-card-title-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
    .menu-card-title { font-family: var(--font-heading); font-size: 1.1rem; }
    .menu-card-price { font-weight: 700; color: var(--accent-gold); font-size: 1.2rem; }

    /* Footer */
    footer { background: var(--bg-surface-1); padding: 3rem 0; text-align: center; border-top: 1px solid var(--glass-border-gold); color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/babel">
    const { useState } = React;

    const RESTAURANT = {
      name: "Guntur Restro",
      tagline: "Authentic Flavours. Unforgettable Moments.",
      address: "Near Srungavarapukota, Boddavara, Tennu, Mulaboddavaram, Andhra Pradesh 535145, India",
      phone: "+91 98765 43210"
    };

    const MENU = [
      { id: 1, name: "Signature Chicken Dum Biryani", price: "280", desc: "Slow-cooked fragrant basmati rice layered with marinated chicken, ghee, and Guntur spices.", img: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?q=80&w=800&auto=format&fit=crop" },
      { id: 2, name: "Royal Mutton Dum Biryani", price: "360", desc: "Aromatic mutton biryani cooked over glowing coals with saffron and caramelized onions.", img: "https://images.unsplash.com/photo-1633945274405-b6c8069047b0?q=80&w=800&auto=format&fit=crop" },
      { id: 3, name: "Authentic Chicken 65", price: "240", desc: "Spicy fried chicken bites tossed with fresh curry leaves and mustard seeds.", img: "https://images.unsplash.com/photo-1610057099443-f63a152d2f62?q=80&w=800&auto=format&fit=crop" },
      { id: 4, name: "Paneer Butter Masala", price: "240", desc: "Soft cottage cheese simmered in a velvety buttery tomato cashew gravy.", img: "https://images.unsplash.com/photo-1631452180519-c014fe946bc7?q=80&w=800&auto=format&fit=crop" },
      { id: 5, name: "Guntur Chilli Chicken", price: "250", desc: "Fiery dry chicken stir fry made with authentic red Guntur chillies.", img: "https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?q=80&w=800&auto=format&fit=crop" },
      { id: 6, name: "Special Matka Kulfi", price: "90", desc: "Traditional slow-cooked thick kulfi with saffron, pistachio and cardamom.", img: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?q=80&w=800&auto=format&fit=crop" }
    ];

    function InstantApp() {
      const [orderModal, setOrderModal] = useState(false);
      const [activeItem, setActiveItem] = useState(null);

      const triggerOrder = (item) => {
        setActiveItem(item);
        setOrderModal(true);
      };

      return (
        <div>
          {/* Header */}
          <header className="header-nav">
            <div className="container header-flex">
              <a href="#" className="brand-title">Guntur <span className="brand-highlight">Restro</span></a>
              <ul className="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
              </ul>
              <button className="btn btn-primary" onClick={() => triggerOrder(null)}>Order Now</button>
            </div>
          </header>

          {/* Hero */}
          <section id="home" className="hero-hero">
            <img src="https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?q=80&w=1920&auto=format&fit=crop" className="hero-hero-bg" alt="Guntur Biryani" />
            <div className="hero-hero-content">
              <h1>Authentic Flavours. <br/><span className="text-gold">Unforgettable Moments.</span></h1>
              <p>Experience delicious biryani and authentic Andhra flavours crafted with passion at Guntur Restro.</p>
              <div className="hero-btns">
                <a href="#menu" className="btn btn-gold">Explore Menu</a>
                <button className="btn btn-primary" onClick={() => triggerOrder(null)}>Order Now</button>
              </div>
            </div>
          </section>

          {/* Menu */}
          <section id="menu" className="container section-padding">
            <h2 style={{ textAlign: 'center', fontFamily: 'Cinzel', fontSize: '2.2rem', marginBottom: '1rem' }}>
              Our Signature <span className="text-gold">Biryani & Dishes</span>
            </h2>
            <div className="menu-grid">
              {MENU.map(item => (
                <div key={item.id} className="glass-card menu-item-card">
                  <img src={item.img} alt={item.name} />
                  <div className="menu-card-title-row">
                    <h3 className="menu-card-title">{item.name}</h3>
                    <span className="menu-card-price">₹{item.price}</span>
                  </div>
                  <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', marginBottom: '1rem' }}>{item.desc}</p>
                  <button className="btn btn-primary" style={{ width: '100%' }} onClick={() => triggerOrder(item)}>Order Dish</button>
                </div>
              ))}
            </div>
          </section>

          {/* Footer */}
          <footer>
            <div className="container">
              <p><strong>{RESTAURANT.name}</strong> • {RESTAURANT.address}</p>
              <p style={{ marginTop: '0.5rem' }}>© 2026 Guntur Restro. All rights reserved.</p>
            </div>
          </footer>

          {/* Simple Modal */}
          {orderModal && (
            <div style={{ position: 'fixed', top:0, left:0, width:'100vw', height:'100vh', background:'rgba(0,0,0,0.8)', zIndex:2000, display:'flex', alignItems:'center', justifyContent:'center' }}>
              <div className="glass-card" style={{ padding:'2rem', maxWidth:'450px', width:'90%', textAlignment:'center' }}>
                <h3 style={{ fontFamily:'Cinzel', color:'var(--accent-gold)', marginBottom:'0.5rem' }}>Place Order - Guntur Restro</h3>
                <p style={{ marginBottom:'1rem' }}>{activeItem ? `Ordering: ${activeItem.name} (₹${activeItem.price})` : "Direct Counter Order"}</p>
                <p style={{ fontSize:'0.9rem', color:'var(--text-muted)', marginBottom:'1.5rem' }}>Call our service desk or place order via WhatsApp for fast pickup or delivery.</p>
                <a href={`tel:${RESTAURANT.phone}`} className="btn btn-primary" style={{ width:'100%', marginBottom:'0.75rem' }}>Call Counter ({RESTAURANT.phone})</a>
                <button className="btn btn-outline" style={{ width:'100%' }} onClick={() => setOrderModal(false)}>Close Window</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<InstantApp />);
  </script>
</body>
</html>
